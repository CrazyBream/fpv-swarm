<!doctype html>
<html lang="uk">
<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#10b981" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FPV Swarm — Lab 05 Authoritative Netcode</title>
</head>
<body>
<canvas id="arena-canvas"></canvas>
<button id="exit-btn" type="button">[ESC] ВИЙТИ З ГРИ</button>

<section id="netlab-bar">
    <label>
        Lag:
        <select id="lag-preset" aria-label="Simulated network latency">
            <option value="0,0,0">0 ms (LAN)</option>
            <option value="100,30,0.02" selected>100 ms ± 30 ms (2% drop)</option>
            <option value="220,50,0.05">220 ms ± 50 ms (5% drop)</option>
        </select>
    </label>
    <button id="toggle-pred-btn" type="button">Prediction: ON</button>
    <button id="toggle-recon-btn" type="button">Reconcile: ON</button>
    <button id="toggle-codec-btn" type="button">Codec: BINARY</button>
    <button id="toggle-drift-btn" type="button">Math.random Bug: OFF</button>
    <button id="spawn-bots-btn" type="button">Spawn 8 AI Bots</button>
</section>

<aside id="comms-panel">
    <div class="comms-header">
        <span id="ws-indicator">WS: OFFLINE</span>
        <span id="roster-count">PILOTS: 0</span>
    </div>
    <div id="roster-list" class="roster-list"></div>
    <div id="chat-log" class="chat-log"></div>
    <form id="chat-form" class="chat-form">
        <input
                id="chat-input"
                type="text"
                aria-label="Tactical chat message"
                placeholder="Send tactical message..."
                maxlength="160"
        />
        <button type="submit">SEND</button>
    </form>
</aside>

<div id="lobby-root"></div>

<div id="exit-overlay">
    <h2>// СЕСІЮ ЗАВЕРШЕНО //</h2>
    <p>Ігровий цикл зупинено, WebSocket закрито, слухачі очищено.</p>
    <button id="restart-btn" type="button">ПОВЕРНУТИСЯ У ЛОБІ</button>
</div>

<div id="error-Banner">
    <span id="error-text"></span>
    <button id="retry-load-btn" type="button">RETRY CLEAN LOAD</button>
</div>

<script type="module" src="src/main.ts"></script>
</body>
</html>
